# Release pipeline: pushing a version tag (v0.0.1-beta, v0.2.0, v1.0.0-rc.1, …) builds the APKs
# (one for 64-bit ARM phones, one for 32-bit ARM ones) signed with the release key and makes them a
# draft GitHub release named after the tag, with an empty "What's Changed" section. Fill that in on
# GitHub and publish the draft: it becomes the latest release (betas too: while the app is in beta,
# every release is one).
#
# A manual run (Actions › Release › Run workflow) is a dry run: it builds the APKs at the version in
# gradle.properties and keeps them as the run's artifact, and releases nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CRAFT_FONTS_DIR: ${{ github.workspace }}/.build-inputs/craft-fonts
  CRAFT_FONTS_REQUIRED: '1'
  CRAFT_FONT_SCRIPTS: Arab

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned Arabic font source
        uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: d1cf47d05e04426615fbda1d637b9ca6b1e7af35
          path: .build-inputs/craft-fonts
      - name: Verify Arabic font and licence
        shell: pwsh
        run: ./tools/prepare-arabic-fonts.ps1 -SourceDirectory $env:CRAFT_FONTS_DIR

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^pdfcraft\.version=//p' apps/pdfcraft-android/android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          # the tag must be the version gradle.properties names (F-Droid builds from that file)
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but gradle.properties says pdfcraft.version=$listed: set it (and pdfcraft.versionCode) before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # the Rust release and targets rust-toolchain.toml names
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          packages="$("$sdkmanager" --list)"
          platform="platforms;android-37"
          if printf '%s' "$packages" | grep -q 'platforms;android-37.0'; then platform="platforms;android-37.0"; fi
          "$sdkmanager" "$platform" "ndk;29.0.14206865" >/dev/null

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "PDFCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: a release is never signed with the debug key"
            exit 1
          else
            echo "::warning::No release key: this dry run is signed with the debug key"
          fi

      # one APK per ABI (each about half the size of one holding both): 64-bit ARM for most
      # phones (pdfcraft-android-<version>.apk), 32-bit ARM for older and low-end ones
      # (pdfcraft-android-<version>-armeabi-v7a.apk)
      - name: Build
        working-directory: apps/pdfcraft-android/android
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for abi in arm64-v8a armeabi-v7a; do
            if [ "$abi" = arm64-v8a ]; then
              ./gradlew testDebugUnitTest lintRelease assembleRelease "-Ppdfcraft.abis=$abi" "-Ppdfcraft.version=$VERSION" --max-workers=2 --no-daemon
            else
              ./gradlew assembleRelease "-Ppdfcraft.abis=$abi" "-Ppdfcraft.version=$VERSION" --max-workers=2 --no-daemon
            fi
            suffix=""; [ "$abi" = arm64-v8a ] || suffix="-$abi"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/pdfcraft-android-$VERSION$suffix.apk"
          done

      - name: APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Android Debug" <<<"$certs"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            {
              echo "    $(basename "$apk")"
              grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  release:
    name: GitHub Release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Draft the release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            for apk in dist/*.apk; do
              asset="$(basename "$apk")"
              if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release upload "$GITHUB_REF_NAME" "$apk"
              fi
            done
            echo "Existing release **$GITHUB_REF_NAME** retained; missing APKs added." >>"$GITHUB_STEP_SUMMARY"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "## What's Changed" -- dist/*
            echo "Draft **$GITHUB_REF_NAME** is ready: fill in What's Changed and publish it." >>"$GITHUB_STEP_SUMMARY"
          fi
