name: Manga TV build

on:
  push:
    branches: [main]
    paths: ['apps/manga-tv/**', '.github/workflows/manga-tv.yml']
  pull_request:
    paths: ['apps/manga-tv/**', '.github/workflows/manga-tv.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manga-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/manga-tv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Test, lint and build APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: manga-tv-apk
          path: |
            apps/manga-tv/app/build/outputs/apk/release/app-release.apk
            apps/manga-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
